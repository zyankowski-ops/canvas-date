<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 16px;
}
</style>
</head>

<body>

<div id="date"></div>

<script>
const today = new Date();

document.getElementById("date").textContent =
  today.toLocaleDateString("en-US", {
    month: "long",
    day: "numeric",
    year: "numeric"
  });
</script>

</body>
</html>
