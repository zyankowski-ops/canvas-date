<script>
const today = new Date();

const weekday = today.toLocaleDateString("en-US", {
  weekday: "long"
}).toUpperCase();

const date = today.toLocaleDateString("en-US", {
  month: "long",
  day: "numeric",
  year: "numeric"
});

document.getElementById("date").textContent =
  weekday + "  •  " + date;
</script>
